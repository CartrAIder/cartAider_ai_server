[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartgate"
version = "0.1.0"
description = "AI exit-gate for self-checkout: receipt-conditioned anomaly detection"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["cartgate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
